<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#140c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Red Weekend">
<title>Red Weekend — Kansas City · Oct 17–19, 2026</title>
<link rel="manifest" href="manifest.json">
<meta name="description" content="Chris + Kat in Kansas City — Chargers @ Chiefs, Oct 17–19, 2026. Itinerary, barbecue, game-day playbook, trivia and bingo.">
<meta property="og:type" content="website">
<meta property="og:title" content="Red Weekend — Kansas City">
<meta property="og:description" content="Chargers @ Chiefs · Oct 17–19 · Jack Stack, Dixon’s, Q39 and the Arrowhead playbook.">
<meta property="og:url" content="https://ortizzle.github.io/family-vacation/kc-chiefs/">
<meta property="og:image" content="https://ortizzle.github.io/family-vacation/kc-chiefs/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#140c0b;        /* stadium-night background */
    --night-2:#1f1311;
    --night-3:#2a1916;
    --red:#c8102e;          /* Red Friday */
    --red-deep:#8f0b20;
    --gold:#f2b632;
    --gold-soft:#f7d98a;
    --stub:#f5ecdc;         /* ticket paper */
    --stub-2:#ebdfc8;
    --ink:#1e1614;
    --ink-soft:#5b4a43;
    --perf:#cdbd9f;
    --chris:#4f9fd8;        /* Chris */
    --kat:#e07aa8;          /* Kat */
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Barlow',sans-serif;background:var(--night);color:var(--stub);
    min-height:100vh;padding-bottom:calc(84px + var(--safe-bot));
    background-image:
      radial-gradient(ellipse 120% 50% at 50% -10%, rgba(200,16,46,.35), transparent 70%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 2px, transparent 2px 9px);
    background-attachment:fixed;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}
  input{font:inherit}

  /* ═══ Sections ═══ */
  .section{display:none}
  .section.on{display:block}
  .sec-head{padding:calc(20px + var(--safe-top)) 18px 6px}
  .sec-kicker{font-family:'Courier Prime',monospace;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft)}
  .sec-head h2{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:2.6rem;line-height:.95;margin-top:4px}
  .sec-head h2 em{font-style:normal;color:var(--gold)}
  .sec-lede{font-size:.9rem;line-height:1.5;color:rgba(245,236,220,.78);margin-top:6px}
  .wrap{padding:6px 16px 20px}

  /* ═══ Hero: the big ticket ═══ */
  .hero{padding:calc(18px + var(--safe-top)) 16px 6px}
  .admit{
    position:relative;display:flex;background:var(--red);color:var(--stub);
    border-radius:10px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.45);
    -webkit-mask:radial-gradient(circle 11px at calc(100% - 92px) 0,#0000 98%,#000) top/100% 51% no-repeat,
                 radial-gradient(circle 11px at calc(100% - 92px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
            mask:radial-gradient(circle 11px at calc(100% - 92px) 0,#0000 98%,#000) top/100% 51% no-repeat,
                 radial-gradient(circle 11px at calc(100% - 92px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  }
  .admit-main{flex:1;padding:16px 14px 14px 18px;position:relative;min-width:0;
    background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 6px)}
  .admit-kicker{font-family:'Courier Prime',monospace;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft)}
  .admit h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:clamp(3rem,15vw,4.2rem);line-height:.86;letter-spacing:.01em;margin:8px 0 6px}
  .admit h1 span{color:var(--gold)}
  .admit-sub{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.95rem;letter-spacing:.12em;text-transform:uppercase}
  .admit-sub b{color:var(--gold)}
  .admit-stub{width:92px;flex:none;border-left:2px dashed rgba(245,236,220,.55);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:10px 6px;text-align:center;background:var(--red-deep)}
  .admit-stub .big{font-family:'Bebas Neue',sans-serif;font-size:2.7rem;line-height:.9;color:var(--gold)}
  .admit-stub .lbl{font-family:'Courier Prime',monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
  .serial{font-family:'Courier Prime',monospace;font-size:.62rem;letter-spacing:.2em;color:rgba(245,236,220,.7);margin-top:10px}

  /* ═══ Trip docs strip ═══ */
  .docs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
  .docs::-webkit-scrollbar{display:none}
  .doc{flex:none;min-width:148px;min-height:64px;text-align:left;border-radius:8px;padding:9px 11px;background:var(--night-2);border:1px solid rgba(245,236,220,.14)}
  .doc .k{font-family:'Courier Prime',monospace;font-size:.58rem;letter-spacing:.16em;color:var(--gold-soft);text-transform:uppercase}
  .doc .v{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.02em;line-height:1.05;margin-top:2px}
  .doc .s{font-size:.72rem;color:rgba(245,236,220,.7);margin-top:1px}

  /* ═══ Day tabs ═══ */
  .daytabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;padding:calc(10px + var(--safe-top)) 16px 10px;
    background:linear-gradient(var(--night) 80%,rgba(20,12,11,0))}
  .daytab{flex:1;min-height:56px;border-radius:8px;border:1.5px solid rgba(245,236,220,.18);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:rgba(245,236,220,.75);background:var(--night-2)}
  .daytab .dow{font-family:'Courier Prime',monospace;font-size:.62rem;letter-spacing:.2em}
  .daytab .num{font-family:'Bebas Neue',sans-serif;font-size:1.55rem;line-height:1}
  .daytab .tg{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
  .daytab.on{background:var(--stub);color:var(--ink);border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,182,50,.25)}
  .daytab.on .num{color:var(--red)}
  .daytab .today{display:none;font-family:'Courier Prime',monospace;font-size:.55rem;background:var(--gold);color:var(--ink);padding:0 5px;border-radius:3px;margin-top:2px}
  .daytab.is-today .today{display:block}

  /* ═══ Day panel ═══ */
  .panel{padding:4px 16px 20px;display:none}
  .panel.on{display:block}
  .day-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px 12px}
  .day-head h2{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:2.1rem;letter-spacing:.02em;line-height:1}
  .day-head h2 em{font-style:normal;color:var(--gold)}
  .tzpill{font-family:'Courier Prime',monospace;font-size:.62rem;letter-spacing:.12em;color:var(--gold-soft);border:1px solid rgba(242,182,50,.4);padding:3px 7px;border-radius:4px;white-space:nowrap}
  .day-lede{font-size:.92rem;line-height:1.5;color:rgba(245,236,220,.82);margin:-4px 2px 16px}

  /* ═══ Game ticket ═══ */
  .gameticket{position:relative;background:var(--stub);color:var(--ink);border-radius:10px;margin-bottom:18px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .gt-band{background:var(--red);color:var(--stub);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;
    font-family:'Courier Prime',monospace;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase}
  .gt-band b{color:var(--gold);text-align:right}
  .gt-body{padding:14px 14px 10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
  .gt-team .nm{font-family:'Bebas Neue',sans-serif;font-size:2rem;line-height:.95}
  .gt-team .rec{font-family:'Courier Prime',monospace;font-size:.62rem;letter-spacing:.12em;color:var(--ink-soft)}
  .gt-team.home .nm{color:var(--red)}
  .gt-at{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--ink-soft)}
  .gt-meta{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px dashed var(--perf);margin:0 10px}
  .gt-meta div{padding:9px 4px 11px;text-align:center}
  .gt-meta .k{font-family:'Courier Prime',monospace;font-size:.58rem;letter-spacing:.16em;color:var(--ink-soft);text-transform:uppercase}
  .gt-meta .v{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.05rem}
  .gt-countdown{background:var(--ink);color:var(--gold);font-family:'Courier Prime',monospace;font-size:.72rem;letter-spacing:.14em;text-align:center;padding:7px;text-transform:uppercase}

  /* ═══ Timeline (each row is a stub) ═══ */
  .tl{list-style:none;position:relative}
  .tl-item{position:relative;display:flex;background:var(--stub);color:var(--ink);border-radius:8px;margin-bottom:10px;min-height:64px;
    -webkit-mask:radial-gradient(circle 7px at 76px 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 7px at 76px 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
            mask:radial-gradient(circle 7px at 76px 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 7px at 76px 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
  .tl-item.tap{cursor:pointer}
  .tl-item.tap:active{transform:scale(.99)}
  .tl-item.alt{opacity:.92;background:var(--stub-2)}
  .tl-time{width:76px;flex:none;border-right:2px dashed var(--perf);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;text-align:center}
  .tl-time .t{font-family:'Bebas Neue',sans-serif;font-size:1.45rem;line-height:1;color:var(--red)}
  .tl-time .ap{font-family:'Courier Prime',monospace;font-size:.62rem;font-weight:700;color:var(--red);letter-spacing:.1em}
  .tl-time .az{font-family:'Courier Prime',monospace;font-size:.56rem;letter-spacing:.04em;color:var(--ink-soft);margin-top:3px}
  .tl-body{flex:1;padding:10px 12px 10px 14px;min-width:0}
  .tl-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.12rem;line-height:1.15;letter-spacing:.01em}
  .tl-note{font-size:.84rem;line-height:1.42;color:var(--ink-soft);margin-top:3px}
  .tl-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tag{font-family:'Courier Prime',monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--stub-2);color:var(--ink)}
  .tag.red{background:var(--red);color:var(--stub)}
  .tag.gold{background:var(--gold);color:var(--ink)}
  .tag.warn{background:#ffe2a6;color:#6b3d00;border:1px solid #e7b04a}
  .tag.dark{background:var(--ink);color:var(--gold-soft)}
  .tl-item.anchor{box-shadow:inset 0 0 0 2px var(--gold)}
  .tl-item.anchor .tl-time{background:var(--gold)}
  .tl-item.anchor .tl-time .t,.tl-item.anchor .tl-time .ap{color:var(--ink)}
  .tl-chev{align-self:center;padding-right:12px;color:var(--ink-soft);font-size:1.3rem}
  .tl-item.done .tl-title{text-decoration:line-through;text-decoration-color:var(--red)}

  /* ═══ A/B fork ═══ */
  .fork{background:var(--night-2);border:1.5px solid rgba(242,182,50,.45);border-radius:10px;padding:12px;margin:4px 0 12px}
  .fork-h{font-family:'Courier Prime',monospace;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
  .fork-q{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1.05rem;margin-bottom:10px;line-height:1.25}
  .fork-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fork-opt{min-height:44px;text-align:left;border-radius:8px;padding:10px;background:rgba(245,236,220,.06);border:1.5px solid rgba(245,236,220,.16)}
  .fork-opt .l{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:.03em;color:var(--gold)}
  .fork-opt .d{font-size:.78rem;line-height:1.35;color:rgba(245,236,220,.8);margin-top:2px}
  .fork-opt.on{background:var(--stub);border-color:var(--gold)}
  .fork-opt.on .l{color:var(--red)}
  .fork-opt.on .d{color:var(--ink-soft)}

  /* ═══ Info card ═══ */
  .card{background:var(--night-2);border:1px solid rgba(245,236,220,.12);border-radius:10px;padding:14px;margin-top:16px}
  .card h3{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:1.45rem;letter-spacing:.03em;color:var(--gold);margin-bottom:8px}
  .card p{font-size:.88rem;line-height:1.5;color:rgba(245,236,220,.85)}
  .card p + p{margin-top:8px}
  .rules{list-style:none}
  .rules li{display:flex;gap:10px;padding:8px 0;border-top:1px dashed rgba(245,236,220,.14);font-size:.88rem;line-height:1.42}
  .rules li:first-child{border-top:0}
  .rules .ic{flex:none;width:24px;text-align:center}
  .rules b{color:var(--stub);font-weight:600}
  .rules span{color:rgba(245,236,220,.8)}
  .card.warn{border-color:rgba(242,182,50,.5);background:linear-gradient(rgba(242,182,50,.08),rgba(242,182,50,.02))}

  /* ═══ Eat: menu cards ═══ */
  .eat{display:flex;flex-direction:column;gap:12px}
  .eat-card{display:block;width:100%;text-align:left;background:var(--stub);color:var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .eat-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;background:var(--ink);color:var(--gold-soft);
    font-family:'Courier Prime',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase}
  .eat-top b{color:var(--gold)}
  .eat-main{padding:11px 12px 12px}
  .eat-name{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;line-height:1;letter-spacing:.01em}
  .eat-cuis{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin-top:2px}
  .eat-why{font-size:.86rem;line-height:1.42;color:var(--ink-soft);margin-top:6px}
  .eat-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .eat-card.closed{opacity:.75}

  /* ═══ Sheet ═══ */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none}
  .sheet-backdrop.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:88vh;overflow-y:auto;background:var(--stub);color:var(--ink);
    border-radius:16px 16px 0 0;padding:10px 18px calc(24px + var(--safe-bot));transform:translateY(105%);transition:transform .28s ease;
    -webkit-overflow-scrolling:touch}
  .sheet.show{transform:translateY(0)}
  .sheet-grab{width:40px;height:4px;border-radius:2px;background:var(--perf);margin:4px auto 12px}
  .sheet-x{position:absolute;top:8px;right:10px;width:44px;height:44px;font-size:1.4rem;color:var(--ink-soft)}
  .sh-kicker{font-family:'Courier Prime',monospace;font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
  .sh-title{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;line-height:.95;margin:4px 40px 4px 0}
  .sh-tag{font-size:.9rem;color:var(--ink-soft);line-height:1.4}
  .sh-facts{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:14px 0 4px;border-top:2px dashed var(--perf);border-bottom:2px dashed var(--perf)}
  .sh-facts div{padding:8px 4px}
  .sh-facts .k{font-family:'Courier Prime',monospace;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .sh-facts .v{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1rem;line-height:1.2}
  .sh-h{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--red);margin:14px 0 4px;letter-spacing:.03em}
  .sh-p{font-size:.92rem;line-height:1.55}
  .sh-p + .sh-p{margin-top:8px}
  .sh-list{list-style:none}
  .sh-list li{padding:6px 0;border-top:1px dashed var(--perf);font-size:.9rem;line-height:1.4}
  .sh-list li:first-child{border-top:0}
  .sh-list b{font-weight:600}
  .sh-menu{margin-top:4px}
  .sh-menu-h{font-family:'Courier Prime',monospace;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:12px 0 2px;padding-bottom:3px;border-bottom:2px solid var(--ink)}
  .sh-mi{display:flex;align-items:baseline;gap:6px;padding:6px 0;border-bottom:1px dotted var(--perf)}
  .sh-mi .nm{font-weight:600;font-size:.92rem}
  .sh-mi .dots{flex:1;border-bottom:1px dotted var(--ink-soft);opacity:.35;transform:translateY(-3px);min-width:10px}
  .sh-mi .pr{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--red);white-space:nowrap}
  .sh-mi-note{font-size:.78rem;color:var(--ink-soft);line-height:1.35;margin:-2px 0 0}
  .sh-mi-wrap.star .nm::before{content:'★ ';color:var(--gold)}
  .sh-menu-note{font-size:.74rem;color:var(--ink-soft);font-style:italic;margin-top:8px;line-height:1.4}
  .sh-tip{margin-top:14px;padding:10px 12px;border-radius:8px;background:#ffe9b8;font-size:.86rem;line-height:1.45;color:#5a3a00}
  .sh-actions{display:flex;gap:8px;margin-top:16px}
  .btn{flex:1;min-height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
  .btn-red{background:var(--red);color:var(--stub)}
  .btn-ink{background:var(--ink);color:var(--gold)}
  .btn-ghost{border:1.5px solid rgba(245,236,220,.25);color:var(--stub)}

  /* ═══ Play: trivia ═══ */
  .subtabs{display:flex;gap:8px;margin:4px 0 14px}
  .subtab{flex:1;min-height:44px;border-radius:8px;border:1.5px solid rgba(245,236,220,.18);background:var(--night-2);
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(245,236,220,.75)}
  .subtab.on{background:var(--red);border-color:var(--red);color:var(--stub)}
  .quiz{background:var(--stub);color:var(--ink);border-radius:10px;padding:14px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
  .qz-top{display:flex;justify-content:space-between;align-items:center;font-family:'Courier Prime',monospace;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .qz-score{color:var(--red);font-weight:700}
  .qz-bar{height:5px;background:var(--stub-2);border-radius:3px;margin:8px 0 12px;overflow:hidden}
  .qz-bar i{display:block;height:100%;background:var(--red);transition:width .3s}
  .qz-q{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.3rem;line-height:1.2}
  .qz-opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .qz-opt{min-height:48px;text-align:left;padding:10px 12px;border-radius:8px;background:#fff;border:1.5px solid var(--perf);font-size:.95rem;line-height:1.3}
  .qz-opt.right{background:#d8f1d6;border-color:#3c9a3a}
  .qz-opt.wrong{background:#f7d3d6;border-color:var(--red)}
  .qz-fact{margin-top:12px;font-size:.88rem;line-height:1.45;color:var(--ink-soft);padding:10px;border-left:3px solid var(--gold);background:#fff8e6;border-radius:0 6px 6px 0}
  .qz-next{margin-top:12px;width:100%}
  .qz-done{text-align:center;padding:10px 0}
  .qz-big{font-family:'Bebas Neue',sans-serif;font-size:4rem;line-height:1;color:var(--red)}
  .qz-best{font-family:'Courier Prime',monospace;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px}

  /* ═══ Play: bingo ═══ */

   Home clock is Arizona (UTC-7, no DST). Kansas City runs Central Daylight (UTC-5) — 2 hours ahead.
   ?simdate=2026-10-18 previews any trip day (9 AM KC time that day). */
function tripNow(){
  const p = new URLSearchParams(location.search).get('simdate');
  if(p) return new Date(p + 'T09:00:00-05:00');
  return new Date();
}
function kcDateStr(d){ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago'}).format(d); }
// "3:25 PM" Central → "1:25 PM AZ"
function azOf(ct){
  const m = ct.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if(!m) return '';
  let h = (+m[1] % 12) + (m[3].toUpperCase()==='PM' ? 12 : 0) - 2;
  if(h < 0) h += 24;
  return ((h % 12) || 12) + ':' + m[2] + (h >= 12 ? ' PM' : ' AM') + ' AZ';
}

const store = {
  get(k, fb){ try{ const v = localStorage.getItem(k); return v===null ? fb : JSON.parse(v); }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// localStorage keys: kc26-forks, kc26-done, kc26-pack, kc26-bingo, kc26-trivia-best, kc26-picks
// UI-only state uses kc26-ui-* (excluded from the Drive backup).

function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined && text !== null) n.textContent = text;
  return n;
}
function link(cls, href, text){
  const a = el('a', cls, text);
  a.href = href; a.target = '_blank'; a.rel = 'noopener';
  return a;
}
const maps = q => 'https://maps.google.com/?q=' + encodeURIComponent(q);

let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function showModal({ title, message, confirmText = 'OK', cancelText = null, onConfirm = null }){
  const overlay = el('div','modal-overlay');
  const box = el('div','modal-box');
  box.append(el('h3',null,title), el('p',null,message));
  const row = el('div','modal-buttons');
  if(cancelText){
    const c = el('button','btn-secondary',cancelText);
    c.addEventListener('click', () => overlay.remove());
    row.appendChild(c);
  }
  const ok = el('button','btn-primary',confirmText);
  ok.addEventListener('click', () => { overlay.remove(); if(onConfirm) onConfirm(); });
  row.appendChild(ok);
  box.appendChild(row);
  overlay.appendChild(box);
  overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

/* ═════════ Sheet ═════════ */
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('sheet-backdrop');
function closeSheet(){
  sheet.classList.remove('show'); backdrop.classList.remove('show');
  document.body.style.overflow = '';
}
backdrop.addEventListener('click', closeSheet);
function openSheet(d){
  sheet.textContent = '';
  const x = el('button','sheet-x','✕'); x.setAttribute('aria-label','Close');
  x.addEventListener('click', closeSheet);
  sheet.append(x, el('div','sheet-grab'));
  if(d.kicker) sheet.appendChild(el('div','sh-kicker',d.kicker));
  sheet.appendChild(el('div','sh-title',d.name));
  if(d.tag) sheet.appendChild(el('div','sh-tag',d.tag));
  if(d.facts){
    const f = el('div','sh-facts');
    d.facts.forEach(([k,v]) => { const c = el('div'); c.append(el('div','k',k), el('div','v',v)); f.appendChild(c); });
    sheet.appendChild(f);
  }
  if(d.order && d.order.length){
    sheet.appendChild(el('div','sh-h','What to order'));
    const ul = el('ul','sh-list');
    d.order.forEach(([a,b]) => { const li = el('li'); li.append(el('b',null,a), ' — ' + b); ul.appendChild(li); });
    sheet.appendChild(ul);
  }
  if(d.menu && d.menu.length){
    sheet.appendChild(el('div','sh-h','📋 Menu'));
    const m = el('div','sh-menu');
    d.menu.forEach(sec => {
      m.appendChild(el('div','sh-menu-h',sec.h));
      sec.items.forEach(([nm, pr, note]) => {
        const star = note && note.startsWith('★');
        const w = el('div','sh-mi-wrap' + (star ? ' star' : ''));
        const row = el('div','sh-mi');
        row.append(el('span','nm',nm), el('span','dots'), el('span','pr',pr || ''));
        w.appendChild(row);
        const n = star ? note.replace(/^★\s*/,'') : note;
        if(n) w.appendChild(el('div','sh-mi-note',n));
        m.appendChild(w);
      });
    });
    if(d.menuNote) m.appendChild(el('div','sh-menu-note',d.menuNote));
    sheet.appendChild(m);
  }
  if(d.list){
    sheet.appendChild(el('div','sh-h','Good to know'));
    const ul = el('ul','sh-list');
    d.list.forEach(([a,b]) => { const li = el('li'); li.append(el('b',null,a), ' — ' + b); ul.appendChild(li); });
    sheet.appendChild(ul);
  }
  (d.body || []).forEach(p => sheet.appendChild(el('p','sh-p',p)));
  if(d.tip) sheet.appendChild(el('div','sh-tip','💡 ' + d.tip));
  const acts = el('div','sh-actions');
  if(d.q) acts.appendChild(link('btn btn-red', maps(d.q), '📍 Map'));
  if(d.url) acts.appendChild(link('btn btn-ink', d.url, '↗ Website'));
  if(acts.children.length) sheet.appendChild(acts);
  sheet.scrollTop = 0;
  sheet.classList.add('show'); backdrop.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function openEat(id){
  const e = EAT.find(x => x.id === id);
  if(!e) return;
  openSheet({ kicker:e.when, name:e.name, tag:e.why,
    facts:[['Cuisine',e.cuisine],['Price',e.price],['Rating',e.rating],['Distance',e.dist]],
    order:e.order, menu:e.menu, menuNote:e.menuNote, body:e.body, tip:e.tip, q:e.q, url:e.url });
}
function openDoc(id){
  const d = DOCS[id];
  openSheet({ kicker:d.kicker, name:d.name, tag:d.tag, facts:d.facts, list:d.list, tip:d.tip, q:d.maps });
}
function openPoi(id){
  const p = POI[id];
  openSheet({ kicker:p.kicker, name:p.name, tag:p.tag, facts:p.facts, body:p.body, tip:p.tip, q:p.q });

// Calendar days between today and the target, both on the KC calendar (no DST traps: noon anchors)
function daysTo(target){
  const a = kcDateStr(tripNow()), b = kcDateStr(target);
  return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);
}

  const now = tripNow();
  const big = (a,b) => { stub.append(el('div','big',a), el('div','lbl',b)); };
  if(now < DEPART){
    const n = daysTo(DEPART);
    if(n <= 1) big(n <= 0 ? 'GO' : '1', n <= 0 ? 'wheels up today' : 'day to wheels up');
    else big(String(n), 'days to wheels up');

    else big(String(Math.max(n,1)), n === 1 ? 'day to kickoff' : 'days to kickoff');
  }else if(now < new Date(KICKOFF.getTime() + 4*3600000)) big('LIVE','game on');
  else big('GG','what a weekend');
  t.append(main, stub);
  h.appendChild(t);
}

/* Picks: Chris vs Kat, settled with the final score */
function buildPicks(){
  const card = el('div','card');
  card.appendChild(el('h3',null,'Chris vs. Kat — Picks'));
  card.appendChild(el('p',null,'Lock your picks before kickoff. Enter the final and the app names a winner (winner pick first, then closest total score).'));
  const picks = store.get('kc26-picks', { chris:{}, kat:{}, final:{} });
  const save = () => { store.set('kc26-picks', picks); judge(); };
  const grid = el('div','picks'); grid.style.marginTop = '12px';
  [['chris','Chris'],['kat','Kat']].forEach(([who,name]) => {
    const col = el('div','pick-col' + (who==='kat'?' kat':''));
    col.appendChild(el('div','pick-name',name));
    col.appendChild(el('label',null,'Winner'));
    const seg = el('div','seg');
    ['KC','LAC'].forEach(tm => {
      const b = el('button', picks[who].win===tm ? 'on' : '', tm);
      b.addEventListener('click', () => { picks[who].win = tm; seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.textContent===tm)); save(); });
      seg.appendChild(b);
    });
    col.appendChild(seg);
    [['kc','Chiefs score'],['lac','Chargers score']].forEach(([k,lbl]) => {
      const l = el('label',null,lbl);
      const inp = el('input'); inp.type = 'number'; inp.inputMode = 'numeric'; inp.min = '0'; inp.max = '99';
      if(picks[who][k] !== undefined) inp.value = picks[who][k];
      inp.addEventListener('input', () => { picks[who][k] = inp.value === '' ? undefined : +inp.value; save(); });
      l.appendChild(inp); col.appendChild(l);
    });
    grid.appendChild(col);
  });
  card.appendChild(grid);

  const fin = el('div','final');
  const row = el('div','final-row');
  [['kc','Final · Chiefs'],['lac','Final · Chargers']].forEach(([k,lbl]) => {
    const l = el('label',null,lbl);
    const inp = el('input'); inp.type = 'number'; inp.inputMode = 'numeric'; inp.min = '0';
    if(picks.final[k] !== undefined) inp.value = picks.final[k];
    inp.addEventListener('input', () => { picks.final[k] = inp.value === '' ? undefined : +inp.value; save(); });
    l.appendChild(inp); row.appendChild(l);
  });
  fin.appendChild(row);
  const v = el('div','verdict');
  fin.appendChild(v);
  card.appendChild(fin);

  function judge(){
    v.textContent = '';
    const f = picks.final;
    if(f.kc === undefined || f.lac === undefined) return;
    if(f.kc === f.lac){ v.textContent = 'A tie? Nobody wins.'; return; }
    const winner = f.kc > f.lac ? 'KC' : 'LAC';
    const score = who => {
      const p = picks[who];
      const right = p.win === winner ? 1 : 0;
      const off = (p.kc === undefined || p.lac === undefined) ? 999 : Math.abs(p.kc - f.kc) + Math.abs(p.lac - f.lac);
      return { right, off };
    };
    const c = score('chris'), k = score('kat');
    let champ;
    if(c.right !== k.right) champ = c.right > k.right ? 'Chris' : 'Kat';
    else if(c.off !== k.off) champ = c.off < k.off ? 'Chris' : 'Kat';
    else champ = null;
    v.append(champ ? champ + ' wins the weekend 🏆' : 'Dead even. Rematch at dinner.');
    const sm = el('small', null, 'Points off — Chris: ' + (c.off===999?'—':c.off) + ' · Kat: ' + (k.off===999?'—':k.off));
    v.appendChild(sm);
  }
  judge();
  return card;
}

function coverDraw(ctx, img, x, y, w, h){
  if(!img){
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, '#3a1514'); g.addColorStop(1, '#140c0b');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(245,236,220,.55)';
    ctx.font = '400 72px "Bebas Neue", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('📷  ADD A PHOTO', x + w/2, y + h/2);
    ctx.textAlign = 'left';
    return;
  }
  const r = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  const sw = w / r, sh = h / r;
  const sx = (img.naturalWidth - sw) / 2, sy = (img.naturalHeight - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function rr(ctx, x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
function shadowText(ctx, t, x, y){
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.75)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 3; ctx.fillText(t, x, y); ctx.restore();
}
const qLabel = st => st.q === 'FINAL' ? 'FINAL' : st.q === 'HALF' ? 'HALF' : st.q === 'PRE' ? 'PREGAME' : st.q + (st.clock ? '  ' + st.clock : '');

function drawFrame(ctx, st, img){
  ctx.clearRect(0, 0, FW, FH);
  ctx.textBaseline = 'alphabetic';
  if(st.style === 'score') drawScoreFrame(ctx, st, img);
  else if(st.style === 'ticket') drawTicketFrame(ctx, st, img);
  else drawPolaroidFrame(ctx, st, img);
}

function drawScoreFrame(ctx, st, img){
  coverDraw(ctx, img, 0, 0, FW, FH);

function renderPlay(){
  const s = document.getElementById('section-play');

  s.appendChild(head);
  const w = el('div','wrap');
  const tabs = el('div','subtabs');
  const body = el('div');
  const which = store.get('kc26-ui-play','trivia');
  [['trivia','🧠 Trivia'],['bingo','🎯 Game Day Bingo']].forEach(([id,lbl]) => {
    const b = el('button','subtab' + (which===id?' on':''), lbl);
    b.addEventListener('click', () => {
      store.set('kc26-ui-play', id);
      tabs.querySelectorAll('.subtab').forEach(x => x.classList.toggle('on', x===b));

  });

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

function buildTrivia(){
  const box = el('div','quiz');
  let order = shuffle(TRIVIA.map((_,i)=>i)).slice(0,10);
  let idx = 0, score = 0;
  function draw(){
    box.textContent = '';
    if(idx >= order.length){
      const best = Math.max(store.get('kc26-trivia-best',0), score);
      store.set('kc26-trivia-best', best);
      const d = el('div','qz-done');
      d.append(el('div','qz-big', score + '/10'),
        el('div','qz-q', score>=9 ? 'Hall of Fame.' : score>=7 ? 'Starting lineup.' : score>=4 ? 'Practice squad.' : 'Waiver wire.'),
        el('div','qz-best','Best this trip: ' + best + '/10'));
      const again = el('button','btn btn-red qz-next','Run it back');
      again.addEventListener('click', () => { order = shuffle(TRIVIA.map((_,i)=>i)).slice(0,10); idx = 0; score = 0; draw(); });
      d.appendChild(again);
      box.appendChild(d);
      return;
    }
    const t = TRIVIA[order[idx]];
    const top = el('div','qz-top');
    top.append(el('span',null,'Question ' + (idx+1) + ' of 10'), el('span','qz-score','Score ' + score));
    const bar = el('div','qz-bar'); const fill = el('i'); fill.style.width = (idx/order.length*100) + '%'; bar.appendChild(fill);
    box.append(top, bar, el('div','qz-q',t.q));
    const opts = el('div','qz-opts');
    const shown = shuffle(t.o.map((o,i)=>({o,i})));
    shown.forEach(({o,i}) => {
      const b = el('button','qz-opt',o);
      b.addEventListener('click', () => {
        if(opts.dataset.done) return;
        opts.dataset.done = '1';
        if(i === t.a){ score++; b.classList.add('right'); }
        else{
          b.classList.add('wrong');
          opts.querySelectorAll('.qz-opt').forEach(x => { if(x.textContent === t.o[t.a]) x.classList.add('right'); });
        }
        box.appendChild(el('div','qz-fact',t.f));
        const nx = el('button','btn btn-ink qz-next', idx+1 < order.length ? 'Next →' : 'See score');
        nx.addEventListener('click', () => { idx++; draw(); });
        box.appendChild(nx);
        top.lastChild.textContent = 'Score ' + score;
      });
      opts.appendChild(b);
    });
    box.appendChild(opts);
  }
  draw();
  return box;
}

function buildBingo(){
  const wrap = el('div');
  const state = store.get('kc26-bingo', {});
  state[12] = true;
  const grid = el('div','bingo');
  const status = el('div','bg-status');
  let won = new Set(BINGO_LINES.filter(l => l.every(i => state[i])).map(l => l.join('-')));
  function paint(){
    const lines = BINGO_LINES.filter(l => l.every(i => state[i]));
    const winCells = new Set(lines.flat());
    grid.querySelectorAll('.bg-cell').forEach((c,i) => {
      c.classList.toggle('on', !!state[i] && i!==12);
      c.classList.toggle('win', winCells.has(i));
    });
    status.textContent = lines.length ? (lines.length===1 ? 'BINGO!' : lines.length + ' × BINGO!') : (Object.keys(state).filter(k=>state[k]).length - 1) + ' / 24 spotted';
    return lines;
  }
  BINGO.forEach(([e,t],i) => {
    const c = el('button','bg-cell' + (i===12?' free':''));
    const em = el('span','e',e); c.append(em, t);
    c.setAttribute('aria-label', t);
    if(i !== 12) c.addEventListener('click', () => {
      state[i] = !state[i];
      store.set('kc26-bingo', state);
      const lines = paint();
      const keys = lines.map(l => l.join('-'));
      if(keys.some(k => !won.has(k))) toast('🏈 BINGO! Touchdown!');
      won = new Set(keys);
    });
    grid.appendChild(c);
  });
  const reset = el('button','btn btn-ghost','Clear board');
  reset.style.marginTop = '12px'; reset.style.width = '100%';
  reset.addEventListener('click', () => showModal({ title:'Clear the board?', message:'This un-marks every square.', confirmText:'Clear', cancelText:'Keep', onConfirm:() => {
    Object.keys(state).forEach(k => delete state[k]); state[12] = true; store.set('kc26-bingo', state); won = new Set(); paint();
  }}));
  wrap.append(grid, status, reset);
  paint();
  return wrap;
}

  upd();
  const drive = el('div','fv-drive-host'); w.appendChild(drive);

}

  arrowhead: { e:'🏈', n:'Arrowhead', lat:39.0489, lon:-94.4839, q:'Missouri Welcome Center, Blue Ridge Cutoff, Kansas City, MO', eat:'arrowhead' },
  q39:       { e:'🔥', n:'Q39 South', lat:38.9290, lon:-94.6840, q:'Q39 South, 11051 Antioch Rd, Overland Park, KS', eat:'q39' },
  urbanegg:  { e:'🥞', n:'Urban Egg', lat:38.9120, lon:-94.6370, q:'Urban Egg, 4921 W 119th St, Overland Park, KS', eat:'urbanegg' }
};
// Known legs from research (Uber's own MCI→Overland Park average: 35 mi, 38 min, $63). Everything else is estimated.
const LEGS = {
  'hotel|mci':        { mi:35,  min:38 },
  'arrowhead|hotel':  { mi:23,  min:30 },
  'dixons|hotel':     { mi:23,  min:30 },
  'arrowhead|dixons': { mi:1.2, min:5 },
  'arrowhead|q39':    { mi:24,  min:31 },
  'dixons|q39':       { mi:24,  min:31 },
  'hotel|q39':        { mi:1.5, min:5 },
  'freight|hotel':    { mi:17,  min:25 },
  'hotel|pl':         { mi:18,  min:25 },
  'freight|mci':      { mi:20,  min:25 },
  'hotel|urbanegg':   { mi:2.2, min:7 }
};
function haversineMi(a, b){
  const R = 3958.8, r = Math.PI/180;
  const dLat = (b.lat-a.lat)*r, dLon = (b.lon-a.lon)*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function legKey(a,b){ return [a,b].sort().join('|'); }
function liveLegs(){ return store.get('kc26-ui-routes', {}); }
// → { mi, min, src: 'known' | 'live' | 'est', geo? }
function leg(a, b){
  const k = legKey(a,b);
  const live = liveLegs()[k];
  if(live) return Object.assign({ src:'live' }, live);
  if(LEGS[k]) return Object.assign({ src:'known' }, LEGS[k]);
  const mi = haversineMi(PLACES[a], PLACES[b]) * 1.3;      // road circuity
  const min = mi < 3 ? 3 + mi*2.5 : 4 + mi*1.05;          // city streets vs. highway
  return { mi, min, src:'est' };
}
/* UberX estimate, calibrated to Uber's published KC averages (MCI→Overland Park $63, MCI→KCMO $39).
   Base + per-mile + per-minute + booking fee; shown as a range, before surge. */
function fare(l){
  const mid = Math.max(9, 3.5 + 1.25*l.mi + 0.30*l.min + 3.0);
  return [Math.round(mid*0.85), Math.round(mid*1.2)];
}
const money = ([lo,hi]) => '$' + lo + '–$' + hi;
const fmtMi = mi => (mi < 10 ? mi.toFixed(1) : Math.round(mi)) + ' mi';
const fmtMin = m => m >= 60 ? Math.floor(m/60) + 'h ' + Math.round(m%60) + 'm' : Math.round(m) + ' min';

function uberLink(a, b){
  const A = PLACES[a], B = PLACES[b];
  const qs = [['action','setPickup'],['pickup[latitude]',A.lat],['pickup[longitude]',A.lon],['pickup[nickname]',A.n],
    ['dropoff[latitude]',B.lat],['dropoff[longitude]',B.lon],['dropoff[nickname]',B.n],['dropoff[formatted_address]',B.q]]
    .map(([k,v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
  return 'https://m.uber.com/ul/?' + qs;
}
function gmapsDir(a, b){
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&origin=' + encodeURIComponent(PLACES[a].q) + '&destination=' + encodeURIComponent(PLACES[b].q);
}

/* Ride chip for timeline items: [from, to, surge?] */
function rideChip(r){
  const [a, b, surge] = r;

  if(surge) tx.appendChild(el('span','sg','Post-game surge can run 1.5–2.5× → ' + money([Math.round(f[0]*1.5), Math.round(f[1]*2.5)])));
  chip.append(tx, el('span','go','🗺 ›'));
  chip.addEventListener('click', e => { e.stopPropagation(); showSection('map'); mapSelect(a, b); });
  return chip;
}

/* ═════════ Map tab ═════════ */
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, text){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in (attrs||{})) n.setAttribute(k, attrs[k]);
  if(text !== undefined) n.textContent = text;
  return n;
}
function proj(p){ return [ (p.lon - MAP_GEO.lon0)*MAP_GEO.c*MAP_GEO.k, (MAP_GEO.lat1 - p.lat)*MAP_GEO.k ]; }
function viewFor(ids, pad, minW){
  const pts = ids.map(id => proj(PLACES[id]));
  let x0 = Math.min(...pts.map(p=>p[0])) - pad, x1 = Math.max(...pts.map(p=>p[0])) + pad;
  let y0 = Math.min(...pts.map(p=>p[1])) - pad, y1 = Math.max(...pts.map(p=>p[1])) + pad;
  const aspect = MAP_GEO.w / MAP_GEO.h;                    // keep the box's shape
  let w = Math.max(x1-x0, minW), h = Math.max(y1-y0, minW/aspect);
  if(w/h > aspect) h = w/aspect; else w = h*aspect;
  const cx = (x0+x1)/2, cy = (y0+y1)/2;
  return [cx - w/2, cy - h/2, w, h];
}
const MAP_VIEWS = [
  ['trip','Whole trip', () => viewFor(Object.keys(PLACES), 45, 200)],
  ['downtown','Downtown', () => viewFor(['freight','union','liberty','pl'], 14, 60)],
  ['stadium','Arrowhead', () => viewFor(['arrowhead','dixons'], 18, 60)],
  ['op','Overland Park', () => viewFor(['hotel','q39','urbanegg'], 16, 70)]
];
const mapState = { view:null, a:null, b:null, svg:null, layers:{}, box:null, card:null };

  base.appendChild(sv('path',{ d:MAP_GEO.state, fill:'none', stroke:'rgba(247,217,138,.45)', 'stroke-width':1.5, 'stroke-dasharray':'6 5', 'vector-effect':'non-scaling-stroke' }));
  Object.entries(MAP_GEO.roads).forEach(([k,r]) => {

let viewAnim = null;
function setView(id, animate){
  const v = MAP_VIEWS.find(x => x[0] === id) || MAP_VIEWS[0];
  mapState.view = v[0];
  store.set('kc26-ui-mapview', v[0]);
  document.querySelectorAll('.mv').forEach(b => b.classList.toggle('on', b.dataset.v === v[0]));
  animateTo(v[2](), animate);
}
function animateTo(target, animate){
  const svg = mapState.svg;
  const from = svg.getAttribute('viewBox').split(' ').map(Number);
  cancelAnimationFrame(viewAnim);
  if(!animate){ svg.setAttribute('viewBox', target.join(' ')); drawPins(); return; }
  const t0 = performance.now(), dur = 420;
  const step = now => {
    const t = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1-t, 3);
    svg.setAttribute('viewBox', from.map((f,i) => f + (target[i]-f)*e).join(' '));
    if(t < 1) viewAnim = requestAnimationFrame(step); else drawPins();
  };
  viewAnim = requestAnimationFrame(step);
}
function unitsPerPx(){
  const vb = mapState.svg.getAttribute('viewBox').split(' ').map(Number);
  const r = mapState.svg.getBoundingClientRect();
  return r.width ? Math.max(vb[2]/r.width, vb[3]/r.height) : vb[2]/360;
}

function drawPins(){
  const { pins, labels } = mapState.layers;
  if(!pins) return;
  pins.textContent = ''; labels.textContent = '';
  const u = unitsPerPx();
  // shields + region text, kept at constant screen size
  MAP_GEO.shields.forEach(sh => {
    const g = sv('g',{ transform:'translate(' + sh.x + ' ' + sh.y + ') scale(' + u + ')' });
    const wdt = sh.t.length > 2 ? 26 : 20;
    g.appendChild(sv('rect',{ x:-wdt/2, y:-8, width:wdt, height:16, rx: sh.us ? 2 : 5, fill: sh.us ? '#f5ecdc' : '#1f3f7a', stroke: sh.us ? '#1e1614' : '#f5ecdc', 'stroke-width':1.2 }));
    g.appendChild(sv('text',{ x:0, y:4, 'text-anchor':'middle', 'font-family':'Barlow Condensed, sans-serif', 'font-weight':700, 'font-size':11, fill: sh.us ? '#1e1614' : '#fff' }, sh.t));
    labels.appendChild(g);
  });
  MAP_GEO.text.forEach(t => {
    const g = sv('g',{ transform:'translate(' + t.x + ' ' + t.y + ') scale(' + u + ')' });
    g.appendChild(sv('text',{ 'text-anchor':'middle', 'font-family':'Courier Prime, monospace', 'font-size': t.t.length > 9 ? 10 : 12, 'letter-spacing':3,
      fill: t.t.length > 9 ? '#6f9bb8' : 'rgba(247,217,138,.45)', 'font-style': t.t.length > 9 ? 'italic' : 'normal' }, t.t));
    labels.appendChild(g);
  });

  // cluster pins that would overlap at this zoom
  const ids = Object.keys(PLACES);
  const pos = Object.fromEntries(ids.map(id => [id, proj(PLACES[id])]));
  const R = 15, clusters = [];
  const sel = mapState.sel || [];
  const clustering = mapState.view === 'trip';
  // Whole-trip view merges crowded pins into a tap-to-zoom cluster; zoomed views (and selected pins)
  // stay individual and get nudged apart with a leader line to their true spot.
  ids.slice().sort((a,b) => sel.includes(b) - sel.includes(a)).forEach(id => {
    const [x,y] = pos[id];
    const c = clustering && !sel.includes(id) && clusters.find(c => c.ids.length && !c.ids.some(i => sel.includes(i)) && Math.hypot(c.x - x, c.y - y) / u < R*2.1);
    if(c){ c.ids.push(id); c.x = (c.x*(c.ids.length-1) + x)/c.ids.length; c.y = (c.y*(c.ids.length-1) + y)/c.ids.length; }
    else clusters.push({ ids:[id], x, y, tx:x, ty:y });
  });
  clusters.forEach((c, i) => {
    if(c.ids.length > 1) return;
    const hit = y => clusters.slice(0, i).some(o => Math.hypot(o.x - c.x, o.y - y) / u < R*2.2);
    for(const k of [0, 1, -1, 2, -2, 3, -3]){ const y = c.ty + k*R*2.3*u; if(!hit(y)){ c.y = y; break; } }
  });
  clusters.forEach(c => {
    const g = sv('g',{ class:'pin', transform:'translate(' + c.x + ' ' + c.y + ') scale(' + u + ')', tabindex:0 });
    if(c.ids.length > 1){
      g.appendChild(sv('circle',{ r:R+3, fill:'#c8102e', stroke:'#f2b632', 'stroke-width':2.5 }));
      g.appendChild(sv('text',{ y:5, 'text-anchor':'middle', 'font-family':'Bebas Neue, sans-serif', 'font-size':17, fill:'#f5ecdc' }, String(c.ids.length)));
      g.appendChild(sv('text',{ x:R+8, y:5, 'font-family':'Barlow Condensed, sans-serif', 'font-weight':700, 'font-size':13, fill:'#f5ecdc', stroke:'#140c0b', 'stroke-width':3, 'paint-order':'stroke' }, clusterName(c.ids) + ' ›'));
      g.appendChild(sv('circle',{ r:24, fill:'transparent' }));
      g.addEventListener('click', () => {
        const preset = { Downtown:'downtown', 'Overland Park':'op', Arrowhead:'stadium' }[clusterName(c.ids)];
        if(preset) setView(preset, true);
        else animateTo(viewFor(c.ids, 14, 60), true);
      });
    }else{
      const id = c.ids[0], p = PLACES[id];
      if(c.y !== c.ty){
        pins.appendChild(sv('line',{ x1:c.tx, y1:c.ty, x2:c.x, y2:c.y, stroke:'#f5ecdc', 'stroke-width':1.2, 'vector-effect':'non-scaling-stroke', opacity:.7 }));
        pins.appendChild(sv('circle',{ cx:c.tx, cy:c.ty, r:3*u, fill:'#f5ecdc' }));
      }
      const role = mapState.a === id ? 'A' : mapState.b === id ? 'B' : null;
      g.appendChild(sv('circle',{ r:R, fill: role ? '#f2b632' : '#f5ecdc', stroke: role ? '#c8102e' : '#1e1614', 'stroke-width': role ? 3.5 : 2 }));
      g.appendChild(sv('text',{ y:5, 'text-anchor':'middle', 'font-size':14 }, p.e));
      if(role){
        g.appendChild(sv('circle',{ cx:R-2, cy:-R+2, r:8, fill:'#c8102e' }));
        g.appendChild(sv('text',{ x:R-2, y:-R+6, 'text-anchor':'middle', 'font-family':'Bebas Neue, sans-serif', 'font-size':12, fill:'#f5ecdc' }, role));
      }
      const vb = mapState.svg.getAttribute('viewBox').split(' ').map(Number);
      const flip = c.x > vb[0] + vb[2]*0.68;     // label on the left near the right edge
      g.appendChild(sv('text',{ x: flip ? -(R+5) : R+5, y:5, 'text-anchor': flip ? 'end' : 'start', 'font-family':'Barlow Condensed, sans-serif', 'font-weight':700, 'font-size':13, fill: role ? '#f2b632' : '#f5ecdc', stroke:'#140c0b', 'stroke-width':3, 'paint-order':'stroke' }, p.n));
      g.appendChild(sv('circle',{ r:24, fill:'transparent' }));      // 48px tap target
      g.addEventListener('click', () => tapPin(id));
    }
    pins.appendChild(g);
  });
  drawRoute();
}

function clusterName(ids){
  if(ids.some(i => ['freight','union','liberty','pl'].includes(i))) return 'Downtown';
  if(ids.some(i => ['hotel','q39','urbanegg'].includes(i))) return 'Overland Park';
  if(ids.includes('arrowhead')) return 'Arrowhead';
  return ids.length + ' stops';
}
function tapPin(id){
  if(!mapState.a || (mapState.a && mapState.b)){ mapState.a = id; mapState.b = null; }
  else if(mapState.a === id){ mapState.a = null; }
  else mapState.b = id;
  mapState.sel = [mapState.a, mapState.b].filter(Boolean);
  mapState.hint.textContent = !mapState.a ? 'Tap a pin to start' : !mapState.b ? PLACES[mapState.a].n + ' → tap a second pin' : 'Tap any pin to start over';
  drawPins(); renderRouteCard();
  if(mapState.a && mapState.b) fetchLive(mapState.a, mapState.b);
}
function mapSelect(a, b){
  mapState.a = a; mapState.b = b; mapState.sel = [a,b];
  mapState.hint.textContent = 'Tap any pin to start over';
  const v = viewFor([a,b], 30, 60);
  document.querySelectorAll('.mv').forEach(x => x.classList.remove('on'));
  animateTo(v, true);
  renderRouteCard();
  fetchLive(a, b);
  setTimeout(() => mapState.card.scrollIntoView({ behavior:'smooth', block:'nearest' }), 450);
}

function drawRoute(){
  const g = mapState.layers.route;
  g.textContent = '';
  const { a, b } = mapState;
  if(!a || !b) return;
  const l = leg(a, b);
  if(l.geo){
    const d = 'M' + l.geo.map(([lon,lat]) => proj({lon,lat}).map(n => n.toFixed(1)).join(' ')).join(' L');
    g.appendChild(sv('path',{ d, fill:'none', stroke:'#140c0b', 'stroke-width':7, 'stroke-linecap':'round', 'stroke-linejoin':'round', 'vector-effect':'non-scaling-stroke' }));
    g.appendChild(sv('path',{ d, fill:'none', stroke:'#c8102e', 'stroke-width':4, 'stroke-linecap':'round', 'stroke-linejoin':'round', 'vector-effect':'non-scaling-stroke' }));
  }else{
    const [x1,y1] = proj(PLACES[a]), [x2,y2] = proj(PLACES[b]);
    g.appendChild(sv('line',{ x1, y1, x2, y2, stroke:'#c8102e', 'stroke-width':3.5, 'stroke-dasharray':'8 6', 'stroke-linecap':'round', 'vector-effect':'non-scaling-stroke' }));
  }
}

function renderRouteCard(){
  const box = mapState.card;
  box.textContent = '';
  const { a, b } = mapState;

  c.appendChild(el('div','rc-note','Estimate before surge and tip, calibrated to Uber’s published KC averages (MCI → Overland Park ≈ $63). The Uber app shows the real price before you confirm.'));

/* Online refinement: real road distance/time + route line from the public OSRM router.
   Results are cached on this phone so they still show offline later. Silent if offline. */
const liveInFlight = {};
function fetchLive(a, b){
  const k = legKey(a, b);
  if(liveLegs()[k] || liveInFlight[k] || !navigator.onLine) return;
  liveInFlight[k] = true;
  const A = PLACES[a], B = PLACES[b];
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const timer = setTimeout(() => ctl && ctl.abort(), 7000);
  fetch('https://router.project-osrm.org/route/v1/driving/' + A.lon + ',' + A.lat + ';' + B.lon + ',' + B.lat + '?overview=simplified&geometries=geojson', ctl ? { signal:ctl.signal } : {})
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      const rt = j && j.routes && j.routes[0];
      if(!rt) return;
      const all = liveLegs();
      // OSRM has no live traffic — pad its drive time 15% to stay realistic
      all[k] = { mi: rt.distance/1609.34, min: rt.duration/60*1.15, geo: rt.geometry.coordinates };
      store.set('kc26-ui-routes', all);
      if(legKey(mapState.a||'', mapState.b||'') === k){ drawRoute(); renderRouteCard(); }
    })
    .catch(() => {})
    .finally(() => { clearTimeout(timer); delete liveInFlight[k]; });
}

/* ═════════ Bottom nav ═════════ */
const NAV = [['days','🎟️','Days'],['map','🗺️','Map'],['eat','🍖','Eat'],['game','🏈','Game'],['play','🎯','Play'],['pack','🧳','Pack']];
function showSection(id){
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('on', s.id === 'section-' + id));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('on', b.dataset.sec === id));
  store.set('kc26-ui-sec', id);
  window.scrollTo(0,0);
  if(id === 'map' && mapState.svg) requestAnimationFrame(drawPins);
}
function renderNav(){
  const nav = document.getElementById('bottomnav');
  NAV.forEach(([id,i,l]) => {
    const b = el('button','nav-btn');
    b.dataset.sec = id;
    b.append(el('span','i',i), el('span','l',l));
    b.addEventListener('click', () => showSection(id));
    nav.appendChild(b);
  });
}

/* ═════════ Boot ═════════ */
if(window.FamilyDrive) FamilyDrive.start({ toast });   // must run before any FamilyDrive.card/bar
renderHero();
renderDocs();
renderDays();
renderMap();
renderEat();
renderGame();
renderPlay();
renderPack();
renderNav();
showSection(store.get('kc26-ui-sec','days'));
if(window.FamilyDrive) FamilyDrive.bar(document.getElementById('drive-bar'));
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
