<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Galveston & the Magic</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1a30; --navy2:#12284a; --navy3:#1b3660;
  --cream:#f3e9d2; --dim:#c9bfa8;
  --brass:#c9a24b; --brass-lt:#e6c878; --brass-dk:#8a6d2b;
  --coral:#ff8a70; --teal:#5fd0c5;
  --c:#e6c878; --a:#7fc4c9; --m:#ff9d8a; --s:#b5d77e;
  --blood:#7a1220; --blood-lt:#d86a78; --ivory:#f4ecec;
  --thunder:#3a5fd0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:var(--cream);font-family:'Josefin Sans',system-ui,sans-serif;font-weight:300;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:relative;text-align:center;padding:calc(16px + env(safe-area-inset-top)) 16px 18px;overflow:hidden;
  background:linear-gradient(180deg,var(--navy3),var(--navy));border-bottom:1px solid var(--brass-dk)}
header svg{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:520px;height:260px;opacity:.26;pointer-events:none}
.kicker{position:relative;letter-spacing:.34em;font-size:11px;color:var(--teal);text-transform:uppercase;margin-top:4px}
h1{position:relative;font-family:'Poiret One',serif;font-weight:400;font-size:36px;line-height:1.05;margin:8px 0 6px;
  background:linear-gradient(180deg,#f6e3a6,var(--brass) 55%,var(--brass-dk));-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--brass);font-size:12px;letter-spacing:.24em}
.rule::before,.rule::after{content:"";height:1px;width:44px;background:linear-gradient(90deg,transparent,var(--brass))}
.rule::after{transform:scaleX(-1)}
.count{position:relative;display:flex;justify-content:center;gap:10px;margin-top:14px}
.count div{min-width:64px;padding:8px 6px 6px;border:1px solid var(--brass-dk);background:rgba(11,26,48,.7);border-radius:10px}
.count b{display:block;font-family:'Poiret One';font-size:28px;color:var(--brass-lt);font-weight:400}
.count span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.count-label{position:relative;margin-top:8px;font-size:13px;color:var(--dim)}
h2.sec{font-family:'Poiret One';font-weight:400;font-size:28px;color:var(--brass-lt);margin:20px 0 4px}
p.lead{margin:0 0 14px;font-size:15px;line-height:1.5;color:var(--dim)}
.card{border:1px solid var(--brass-dk);border-radius:14px;padding:14px 16px;margin:12px 0;background:linear-gradient(135deg,rgba(201,162,75,.12),transparent 60%),var(--navy2)}
.card h3{font-family:'Poiret One';font-weight:400;font-size:22px;margin:0 0 4px;color:var(--brass-lt)}
.card p{margin:4px 0;font-size:15px;line-height:1.5;color:var(--dim)}
.card.tap{display:block;width:100%;text-align:left;min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:84px;border:1px solid var(--brass-dk);border-radius:14px;background:var(--navy2);padding:12px;text-align:left}
.tile i{font-style:normal;font-size:24px;display:block;margin-bottom:4px}
.tile b{font-weight:600;font-size:15px;display:block}
.tile span{font-size:12px;color:var(--dim)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;padding:0 14px;border:1px solid var(--brass-dk);background:transparent;color:var(--cream);
  font-size:14px;display:flex;align-items:center;gap:8px;border-radius:22px}
.chip.on{background:var(--brass);color:var(--navy);font-weight:600;border-color:var(--brass-lt)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;position:sticky;top:0;background:var(--navy);z-index:5;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 62px;min-height:60px;border:1px solid var(--brass-dk);background:var(--navy2);color:var(--dim);border-radius:12px;position:relative}
.tab small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.tab b{font-family:'Poiret One';font-size:20px;font-weight:400}
.tab.on{border-color:var(--brass-lt);color:var(--brass-lt);box-shadow:inset 0 -3px 0 var(--brass)}
.tab.today::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--coral)}
.phase{display:inline-block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--teal);margin-bottom:4px}
.item{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid rgba(201,162,75,.22)}
.time{font-family:'Poiret One';font-size:17px;color:var(--brass-lt);line-height:1.15}
.time small{display:block;font-family:'Josefin Sans';font-size:10px;letter-spacing:.12em;color:var(--dim);margin-top:3px}
.item h4{margin:0 0 4px;font-size:16px;font-weight:600}
.item p{margin:0;font-size:14px;line-height:1.45;color:var(--dim)}
.item.anchor h4{color:var(--brass-lt)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--brass-dk);color:var(--brass-lt);border-radius:10px}
.tag.opt{border-color:var(--teal);color:var(--teal)}
.warn{border:1px solid var(--coral);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px;line-height:1.45;color:#ffd5cb;background:rgba(255,138,112,.08)}
.empty{font-size:14px;color:var(--dim);text-align:center;margin:18px 0}
.acc{border:1px solid var(--brass-dk);border-radius:14px;margin:10px 0;background:var(--navy2);overflow:hidden}
.acc>button{width:100%;min-height:56px;background:none;border:0;text-align:left;padding:0 16px;font-size:17px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.acc>button span{color:var(--brass-lt);font-size:13px;font-weight:400}
.acc .body{padding:0 16px 14px}
.check{display:flex;align-items:flex-start;gap:12px;min-height:44px;padding:8px 0;width:100%;background:none;border:0;text-align:left;border-bottom:1px solid rgba(201,162,75,.15);font-size:15px;line-height:1.4}
.check .box{flex:0 0 24px;height:24px;border:1px solid var(--brass);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:600;margin-top:1px}
.check.on .box{background:var(--brass-lt)}
.check.on .lbl{color:var(--dim);text-decoration:line-through}
.sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--teal);margin:14px 0 4px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--brass-lt);background:var(--brass);color:var(--navy);font-weight:600}
.btn.ghost{background:transparent;color:var(--brass-lt)}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row input,.row select{flex:1 1 140px;min-width:0;min-height:48px;background:#081424;border:1px solid var(--brass-dk);color:#fff;font-size:16px;padding:0 12px;border-radius:12px}
.msg{min-height:20px;font-size:14px;margin-top:8px;color:var(--coral)}
/* Book */
.book{border:1px solid #a0303f;border-radius:16px;background:linear-gradient(160deg,#2a0a10,#14060a);padding:16px;margin:12px 0}
.book.th{border-color:var(--thunder);background:linear-gradient(160deg,#0c1a44,#060b1c)}
.book .kick{font-size:10px;letter-spacing:.3em;color:#e9c9c9;text-transform:uppercase}
.book h3{font-family:'Poiret One';font-weight:400;font-size:24px;margin:4px 0 2px;color:var(--ivory)}
.book p,.book li{font-size:15px;line-height:1.5;color:#e2ccce;margin:6px 0}
.book.th p,.book.th li{color:#cfd8f5}
.book ul{padding-left:20px;margin:6px 0}
.book .q{color:#fff;font-weight:400}
.book .row input{background:#0d0406;border-color:#a0303f}
.book.th .row input{background:#050a1a;border-color:var(--thunder)}
.book .btn{background:var(--blood);border-color:var(--blood-lt);color:#fff}
.book.th .btn{background:var(--thunder);border-color:#8aa4ff}
.book .btn.ghost{background:transparent;color:var(--ivory)}
.bar{height:10px;border-radius:5px;background:#3a1218;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blood-lt),#f4c3c9)}
.opt{display:block;width:100%;min-height:44px;margin:6px 0;padding:8px 12px;border-radius:10px;border:1px solid #6b2a33;background:transparent;text-align:left;font-size:15px;color:#f1e3e4}
.opt.right{background:#1f5a3a;border-color:#5fd09a}
.opt.wrong{background:#5a1f1f;border-color:var(--coral)}
.plain .opt{border-color:var(--brass-dk);color:var(--cream)}
.rl{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.rl .t{flex:1;min-width:0;font-size:15px;line-height:1.35;color:#fff;overflow-wrap:anywhere}
.rl .t small{display:block;color:#e2ccce;font-size:12px}
.bingo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bingo button{aspect-ratio:1;border:1px solid var(--brass-dk);border-radius:10px;background:var(--navy2);font-size:11px;line-height:1.2;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bingo button i{font-style:normal;font-size:22px}
.bingo button.on{background:var(--brass);color:var(--navy);font-weight:600}
.scard{border:2px solid var(--brass-lt);border-radius:16px;padding:18px;text-align:center;margin-top:12px}
.scard b{font-family:'Poiret One';font-size:26px;font-weight:400;display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(11,26,48,.96);border-top:1px solid var(--brass-dk);
  padding-bottom:env(safe-area-inset-bottom);z-index:20;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
nav button{flex:1;min-height:60px;background:none;border:0;color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
nav button i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
nav button.on{color:var(--brass-lt)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--cream);color:var(--navy);
  padding:10px 16px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;border-radius:12px;max-width:90vw;z-index:50;text-align:center}
.toast.show{opacity:1}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-box{background:var(--navy2);border:1px solid var(--brass);border-radius:16px;padding:22px;max-width:90vw;width:340px}
.modal-box h3{font-family:'Poiret One';font-weight:400;font-size:24px;margin:0 0 8px;color:var(--brass-lt)}
.modal-box p{margin:0;font-size:15px;line-height:1.5}
.modal-buttons{display:flex;gap:12px;margin-top:20px}
.modal-buttons button{flex:1}
.confetti{position:fixed;top:-30px;font-size:22px;pointer-events:none;z-index:60;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.seg{display:flex;gap:6px;margin:10px 0 2px}
.seg button{flex:1;min-height:44px;border:1px solid var(--brass-dk);border-radius:12px;background:transparent;font-size:14px;color:var(--cream)}
.seg button.on{background:var(--teal);border-color:var(--teal);color:var(--navy);font-weight:600}
.mapbox{border:1px solid var(--brass-dk);border-radius:14px;background:#081424;overflow:hidden;margin:10px 0}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapbox g.zoom{transition:transform .6s ease;transform-origin:0 0}
.mapbox text{font-family:'Josefin Sans',sans-serif;fill:var(--cream);pointer-events:none}
.mapbox .stop{cursor:pointer}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px}
.lst{padding-left:20px;margin:4px 0}
.lst li{font-size:14px;line-height:1.45;margin:4px 0;color:var(--dim)}
.qcard{border:1px solid var(--brass);border-radius:14px;padding:14px;background:#0d2140;margin-top:8px}
.qcard .qq{font-size:18px;line-height:1.4;color:#fff;font-weight:400;margin:0 0 8px}
.qbar{height:12px;border-radius:6px;background:#0a1730;overflow:hidden;margin:6px 0 2px;border:1px solid var(--brass-dk)}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--brass-lt));transition:width .4s}
.mnum{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 14px}
.mnum .dg{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:20px}
.mnum .dots{display:flex;gap:8px}.mnum .dots i{width:14px;height:14px;border-radius:50%;background:var(--brass-lt);display:block}
.mnum .barx{width:86px;height:10px;border-radius:5px;background:var(--brass-lt)}
.scr{font-family:'Poiret One';font-size:30px;letter-spacing:.2em;color:var(--brass-lt);text-align:center;margin:6px 0}
.lc{padding:10px 0;border-bottom:1px solid rgba(201,162,75,.15)}
.lc b{font-weight:600;color:var(--brass-lt);display:block;margin-bottom:2px}
.lc p{margin:0;font-size:15px;line-height:1.5;color:var(--dim)}
.foot{font-size:12px;color:var(--dim);text-align:center;margin:22px 0 8px;line-height:1.5}
</style>
</head>

<script>
(function(){
'use strict';

/* ---------- canonical helpers (family-app-standards) ---------- */
const AZ={tz:'America/Phoenix',
  dateKey(d){return new Intl.DateTimeFormat('en-CA',{timeZone:this.tz}).format(d);},
  daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}};
const Store={ns:'gm26_',
  get(k,f=null){try{const r=localStorage.getItem(this.ns+k);return r===null?f:JSON.parse(r);}catch(e){return f;}},
  set(k,v){try{localStorage.setItem(this.ns+k,JSON.stringify(v));return true;}catch(e){return false;}}};
const SIM=(function(){try{const m=/[?&]simdate=(\d{4}-\d{2}-\d{2})/.exec(location.search);return m?m[1]:null;}catch(e){return null;}})();
function tripNow(){return SIM?new Date(SIM+'T19:00:00Z'):new Date();}
function tripToday(){return SIM||AZ.dateKey(new Date());}

function h(tag,props,...kids){const e=document.createElement(tag);
  if(props)for(const k in props){const v=props[k];
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='on'){for(const ev in v)e.addEventListener(ev,v[ev]);}
    else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v);}
  kids.forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;}
function clear(e){while(e.firstChild)e.removeChild(e.firstChild);}
function showModal({title,message,confirmText='OK',cancelText=null,onConfirm=null}){
  const overlay=h('div',{class:'modal-overlay'});const box=h('div',{class:'modal-box'});
  const row=h('div',{class:'modal-buttons'});
  if(cancelText)row.appendChild(h('button',{class:'btn ghost',type:'button',text:cancelText,on:{click:()=>overlay.remove()}}));
  row.appendChild(h('button',{class:'btn',type:'button',text:confirmText,on:{click:()=>{overlay.remove();if(onConfirm)onConfirm();}}}));
  box.append(h('h3',{text:title}),h('p',{text:message}),row);overlay.appendChild(box);
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});document.body.appendChild(overlay);}
let toastEl,toastT;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2400);}
function confetti(set){const em=set||['✨','⭐','🎉','⚓','💛'];for(let i=0;i<18;i++){const s=h('span',{class:'confetti',text:em[i%em.length]});
  s.style.left=(Math.random()*96)+'vw';s.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2600);}}
function save(k,v){if(!Store.set(k,v))toast('Could not save on this device');}

/* ---------- data: families ---------- */
const FAMS={c:{name:'Chris & Kat',who:'Chris, Kat, Sedona, River',color:'var(--c)'},a:{name:"Amy's",who:'Amy, Justin, Ava, Emma',color:'var(--a)'},
  m:{name:"Melissa's",who:'Melissa, Jonathan, Rhett, Byron',color:'var(--m)'},s:{name:"Shay's",who:'Shay, Tyler, Parker, Teagan',color:'var(--s)'}};
const ALL='cams';
const DIN=['5:45 PM','Ship','Dinner, Main Dining','Everyone together. Seating can be changed on board.',ALL,'Dinner','a'];
const SHOW=['8:15 PM','Ship','Evening show','Walt Disney Theatre, everyone.',ALL,'Show','a'];

/* [time, zone, title, detail, parties, tag, flag]  flag: a=booked anchor, o=option */
const DAYS=[
{date:'2026-11-19',dow:'Thu',md:'19',phase:'The Drive',title:'The Long Haul East',blurb:'Chandler to the Gulf in one push: about 1,200 miles and 21 hours with stops. Times are estimates.',items:[
 ['12:00 PM','AZ','Wheels up from Chandler','Full tank, cooler loaded, Scythe queued up. I-10 east the whole way.','c','Depart','a'],
 ['1:45 PM','AZ','Tucson Costco fuel','Mile 115. Fuel here or nearby: Tucson to El Paso is 315 miles, close to a full tank.','c','Fuel'],
 ['7:00 PM','El Paso','El Paso Costco: gas, then dinner','Mile 430. Fill up first because Costco pumps close in the evening. Last warehouse fuel until Houston.','c','Fuel'],
 ['12:15 AM','Texas','Fort Stockton fuel','Mile 665. Clocks jump an hour ahead in West Texas. Good spot for a driver swap.','c','Fuel']],
 notes:['Check the El Paso Costco gas closing time before you leave. If you are running late, any big-brand station off I-10 works.']},
{date:'2026-11-20',dow:'Fri',md:'20',phase:'The Drive → The Ship',title:'Gulf by Morning, Sea by Night',blurb:'Sunrise in Hill Country, breakfast on the island, and the ship by afternoon.',items:[
 ['5:00 AM','Texas','San Antonio 24-hour fuel','Mile 980. Costco is closed at this hour, so use any open station on I-10.','c','Fuel'],
 ['6:00 AM','Texas',"Buc-ee's, Luling",'Open around the clock. Clean restrooms, breakfast tacos, and a leg stretch before Houston traffic.','c','Rest'],
 ['10:00 AM','Texas','Arrive Galveston','Breakfast near the Strand, then prepaid port parking.','c','Arrive'],
 ['12:00 PM','Texas','Port arrival time','Check in at the cruise terminal. Travel documents and port arrival form in hand.','c','Ship','a'],
 ['3:00 PM','Ship','All aboard','Every family must be on the ship.',ALL,'Ship','a'],
 ['4:00 PM','Ship','Disney Magic sails','Sail-away party on deck as Galveston slips behind.',ALL,'Ship','a'],

 ['10:30 AM','Ship','50-minute facial','Senses Spa. Melissa.','m','Spa','a'],
 ['10:30 AM','Ship','Royal Indulgence','Senses Spa until 12:15. Shay.','s','Spa','a'],
 ['12:00 PM','Ship','Palo Brunch','Until 1:30. Chris and Kat.','c','Dining','a'],
 ['1:00 PM','Ship','Beer tasting (21+)','Until 2:00. Justin, Melissa and Jonathan, Tyler.','ams','Tasting','a'],

 DIN,SHOW],

{date:'2026-11-22',dow:'Sun',md:'22',phase:'The Cruise',title:'Cozumel, Mexico',blurb:'Port day. Three families head ashore and the Ortiz crew gets a quiet ship.',items:[

  ['Six flags','Six nations have flown their flag over Texas: Spain, France, Mexico, the Republic of Texas, the Confederacy, and the United States.'],

 ['🗿 The Maya and Chichen Itza',[
  ['Who were the Maya?','A civilization of city-states across southern Mexico and Central America. Their great age of city building ran from about 250 to 900 AD. Chichen Itza was at its height a little later, roughly 900 to 1200. The Maya never vanished. Millions live in the region today and speak Mayan languages.'],
  ['Math and sky','The Maya counted in twenties using dots for ones, bars for fives, and a shell for zero. They ran two calendars at once, one of 365 days and one of 260, and tracked Venus closely.'],
  ['El Castillo','The big pyramid is a temple to Kukulkan, the feathered serpent. It has four stairways of 91 steps. With the top platform that makes 365. On the equinoxes the afternoon sun draws a snake of light down the north stairs. Clap at the base and the echo chirps. Nobody may climb it.'],
  ['What else to spot','The Great Ball Court, the largest in the ancient Americas, with stone rings high on the walls. El Caracol, the round observatory. The Temple of the Warriors and its forest of columns. A platform carved with rows of skulls. The Sacred Cenote, a short walk north.'],
  ['Cenotes','The Yucatan is a slab of limestone with almost no rivers on top. Rain sinks through and flows underground. Where the roof caves in you get a cenote. The Maya treated them as water sources and as doorways to the underworld.'],
  ['The dinosaur connection','About 66 million years ago an asteroid struck right here. The Chicxulub crater is buried under the coast, and the town it is named for is a few miles from the Progreso pier. A ring of cenotes traces the crater’s edge.'],
  ['Taste it','Corn, beans, squash, chili, and cacao come from this part of the world. If lunch has cochinita pibil, slow-roasted pork, that is the Yucatan’s signature dish.']]],
 ['🎬 Apocalypto: movie and history',[

  ['Where it stretches','The film squeezes centuries together. The great Classic cities had faded about 600 years before Spanish ships arrived. Sacrifice on that scale is closer to what was written about the Aztecs. Many scholars also felt it shows the Maya mostly as violent and leaves out their math, writing, and astronomy.'],

}
function ReadingList(w){
  const list=Store.get('reading',[]);const STAT=['Planning','Reading','Finished'];
  const card=h('div',{class:'book',style:'border-color:var(--brass);background:var(--navy2)'});w.appendChild(card);
  card.append(h('div',{class:'kick',style:'color:var(--teal)',text:'My trip reading list'}),h('h3',{text:'Other Books'}),h('p',{text:'Add anything else you are reading or plan to read on the trip. Tap the status to change it.'}));
  if(!list.length)card.appendChild(h('p',{text:'Nothing here yet. Add your first book.'}));
  list.forEach((bk,i)=>card.appendChild(h('div',{class:'rl'},h('div',{class:'t'},bk.title,h('small',{text:bk.who||''})),
    h('button',{type:'button',class:'btn ghost sm',text:STAT[bk.s]+(bk.s===2?' ✓':''),on:{click:()=>{bk.s=(bk.s+1)%3;save('reading',list);if(bk.s===2)confetti(['📚','⭐']);render();}}}),
    h('button',{type:'button',class:'btn ghost sm','aria-label':'Remove '+bk.title,text:'✕',on:{click:()=>showModal({title:'Remove this book?',message:bk.title,confirmText:'Remove',cancelText:'Keep',onConfirm:()=>{list.splice(i,1);save('reading',list);render();}})}}))));
  const title=h('input',{type:'text',maxlength:'80',placeholder:'Book title','aria-label':'Book title'});
  const who=h('input',{type:'text',maxlength:'20',placeholder:'Who is reading',value:BOOK.reader&&BOOK.reader!=='Reader'?BOOK.reader:'','aria-label':'Who is reading'});
  const add=()=>{const t=title.value.trim();if(!t){toast('Type a title first');return;}list.push({title:t,who:who.value.trim(),s:0});save('reading',list);render();};
  title.addEventListener('keydown',e=>{if(e.key==='Enter')add();});
  card.appendChild(h('div',{class:'row'},title,who));card.appendChild(h('div',{class:'row'},h('button',{type:'button',class:'btn',text:'Add book',on:{click:add}})));
}

if(window.FamilyDrive)FamilyDrive.start({toast});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
})();
</script>
